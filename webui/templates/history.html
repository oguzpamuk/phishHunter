<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>phishHunter — History</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="shell">
  <nav class="nav">
    <div class="brand"><span class="fish">phish</span>Hunter</div>
    <a class="item" href="/"><span class="dot"></span>Dashboard</a>
    <a class="item" href="/analyze"><span class="dot"></span>New analysis</a>
    <a class="item active" href="/history"><span class="dot"></span>History</a>
    <a class="item" href="/settings" id="nav-settings" style="display:none"><span class="dot"></span>Settings</a>
    <div class="spacer"></div>
    <div class="userbox">
      <div class="who" id="me-name"></div>
      <div class="links"><a href="/account">Password</a><button class="linkbtn" id="logout">Log out</button></div>
    </div>
  </nav>

  <main class="main">
    <h1 class="page-title">History</h1>
    <p class="page-sub">Every past analysis — filter by verdict or search by filename.</p>

    <div class="filterbar">
      <div class="seg-group" id="verdict-filter" role="tablist" aria-label="Verdict filter">
        <button class="on" data-v="">All</button>
        <button data-v="malicious">Malicious</button>
        <button data-v="suspicious">Suspicious</button>
        <button data-v="clean">Clean</button>
        <button data-v="disagree">AI disagrees</button>
        <button data-v="error">Errors</button>
        <button data-v="running">Running</button>
      </div>
      <input type="text" id="q" placeholder="Search filename or id…"
             style="flex:1; min-width:180px" aria-label="Search filename">
      <span id="count" style="color:var(--faint); font-size:13px"></span>
    </div>

    <div class="card">
      <table class="list" id="tbl">
        <thead><tr>
          <th>File</th><th>Rule-based</th><th>Score</th>
          <th>AI analyst</th><th>When</th><th class="admin-col" style="display:none"></th>
        </tr></thead>
        <tbody></tbody>
      </table>
      <div class="empty" id="empty" style="display:none">
        Nothing matches this filter. Clear it or
        <a href="/analyze">run a new analysis</a>.
      </div>
    </div>
  </main>
</div>

<script>
/* ---- session (shared by every console page) -----------------------------
   * any 401 from the API sends the browser to /login and back here after;
   * POST() adds the CSRF header to JSON requests;
   * loadMe() fills the user box and shows "Settings" to admins.          */
const _fetch = window.fetch.bind(window);
window.fetch = async (url, opts) => {
  const r = await _fetch(url, opts);
  if (r.status === 401) location.href = "/login?next=" +
      encodeURIComponent(location.pathname + location.search);
  return r;
};
const POST = (url, body) => fetch(url, {method: "POST",
  headers: {"Content-Type": "application/json", "X-PhishHunter-Request": "1"},
  body: JSON.stringify(body || {})});
let ME = null;
async function loadMe() {
  const r = await fetch("/api/me");
  if (!r.ok) return null;
  ME = await r.json();
  document.getElementById("me-name").textContent =
      `${ME.username} · ${ME.role === "admin" ? "admin" : "read-only"}`;
  if (ME.role === "admin" && !ME.must_change)
      document.getElementById("nav-settings").style.display = "";
  return ME;
}
const ME_READY = loadMe();
document.getElementById("logout").onclick = async () => {
  await POST("/api/logout"); location.href = "/login"; };

/* ---- page --------------------------------------------------------------- */
/* HTML-escape every value that comes from the API before it reaches
   innerHTML: stage errors, file names and AI output can carry text an
   attacker controls (e.g. through prompt injection). */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({
  "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
/* History controller: keeps the verdict segment + search box in sync with
   /api/analyses (server-side filtering), debounces typing, and links each
   row to its report (or live progress when still running). */
let verdict = "", q = "", debounce = null;

const fmtTime = iso => new Date(iso).toLocaleString(undefined,
    {year:"numeric", month:"short", day:"numeric",
     hour:"2-digit", minute:"2-digit"});
const badge = row => {
  if (row.status === "running") return '<span class="badge running">running</span>';
  if (row.status === "error")   return '<span class="badge error">error</span>';
  return `<span class="badge ${esc(row.verdict)}">${esc(row.verdict||"?")}</span>`;
};

async function load() {
  const params = new URLSearchParams();
  if (verdict) params.set("verdict", verdict);
  if (q) params.set("q", q);
  const r = await fetch("/api/analyses?" + params);
  const {items} = await r.json();

  document.getElementById("count").textContent =
      `${items.length} result${items.length === 1 ? "" : "s"}`;
  const tbody = document.querySelector("#tbl tbody");
  tbody.innerHTML = "";
  document.getElementById("empty").style.display =
      items.length ? "none" : "block";

  for (const row of items) {
    const tr = document.createElement("tr");
    tr.className = "row";
    // The AI column carries the disagreement marker: scanning this list,
    // an analyst should be able to spot the rows the rules got wrong.
    const aiCell = row.ai_verdict
      ? `<span class="badge ${esc(row.ai_verdict)}">${esc(row.ai_verdict)}</span>` +
        (row.ai_confidence != null
          ? ` <span class="mono" style="color:var(--muted)">${esc(row.ai_confidence)}</span>` : "") +
        (row.ai_agrees === 0
          ? ` <span style="color:var(--suspicious)" title="AI reached a different conclusion">&#9888;</span>` : "")
      : `<span style="color:var(--faint)">–</span>`;
    tr.innerHTML = `<td class="mono">${esc(row.filename)}</td>
      <td>${badge(row)}</td>
      <td class="score">${esc(row.score ?? "–")}</td>
      <td>${aiCell}</td>
      <td style="color:var(--muted)">${fmtTime(row.created_utc)}</td>`;
    tr.onclick = () => location.href =
        row.status === "running" ? `/analyze?id=${row.id}` : `/report/${row.id}`;
    // Admins can delete a finished analysis (email, report and log).
    if (ME && ME.role === "admin") {
      const td = document.createElement("td");
      if (row.status !== "running") {
        const b = document.createElement("button");
        b.className = "btn small danger"; b.textContent = "Delete";
        b.onclick = async ev => {
          ev.stopPropagation();          // do not open the report
          if (!confirm(`Delete the analysis of ${row.filename}?`)) return;
          const r = await POST(`/api/analysis/${row.id}/delete`);
          if (r.ok) load();
          else alert((await r.json().catch(() => ({}))).error || "Delete failed.");
        };
        td.appendChild(b);
      }
      tr.appendChild(td);
    }
    tbody.appendChild(tr);
  }
}

document.getElementById("verdict-filter").onclick = e => {
  const btn = e.target.closest("button");
  if (!btn) return;
  document.querySelectorAll("#verdict-filter button")
      .forEach(b => b.classList.toggle("on", b === btn));
  verdict = btn.dataset.v;
  load();
};
document.getElementById("q").oninput = e => {
  clearTimeout(debounce);
  debounce = setTimeout(() => { q = e.target.value.trim(); load(); }, 250);
};

// Allow deep-linking from the dashboard, e.g. /history?f=disagree
const preset = new URLSearchParams(location.search).get("f");
if (preset) {
  const btn = document.querySelector(`#verdict-filter button[data-v="${preset}"]`);
  if (btn) {
    document.querySelectorAll("#verdict-filter button")
        .forEach(b => b.classList.toggle("on", b === btn));
    verdict = preset;
  }
}

ME_READY.then(me => {
  if (me && me.role === "admin")
    document.querySelectorAll(".admin-col").forEach(e => e.style.display = "");
  load();
});
setInterval(load, 8000);   /* keep running rows fresh */
</script>
</body>
</html>
